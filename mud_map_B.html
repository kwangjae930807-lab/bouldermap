<!doctype html><html><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/><style>html,body,#map{height:100%;margin:0} .lbl{background:rgba(17,17,17,.82);color:#fff;border:0;border-radius:10px;padding:1px 6px;font:700 12px/1.3 system-ui,"Malgun Gothic",sans-serif;white-space:nowrap}.lbl:before{display:none} .title{position:absolute;z-index:999;left:10px;top:10px;background:rgba(0,0,0,.62);color:#fff;padding:6px 10px;border-radius:10px;font:700 15px/1.2 "Malgun Gothic",system-ui,sans-serif} .note{position:absolute;z-index:999;right:10px;bottom:10px;background:rgba(255,255,255,.9);color:#222;padding:4px 8px;border-radius:8px;font:12px/1.2 system-ui}</style></head><body><div class="title">무등산 B구역 볼더 위치</div><div id="map"></div><div class="note">위치: thetopo 좌표(대략) · 지도 API: Esri/OSM</div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>

const map=L.map('map');
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Esri'}).addTo(map);
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_only_labels/{z}/{x}/{y}.png',{maxZoom:19,pane:'shadowPane',opacity:0.95}).addTo(map);
const g=[]; pts.forEach(p=>{ const c=L.circleMarker([p.lat,p.lon],{radius:11,color:'#111',weight:2,fillColor:p.color,fillOpacity:0.95}).addTo(map); if(p.n!=='') c.bindTooltip(String(p.n),{permanent:true,direction:'center',className:'lbl'}); c.bindPopup('<b>'+ (p.n? p.n+'. ':'') + p.name+'</b>'+(p.inf?'<br><span style="color:#666">구역 추정</span>':'')+'<br><span style="color:#666">'+p.sec+'</span>'); g.push([p.lat,p.lon]); });

function updateView() {
  map.invalidateSize();
  if (g.length > 1) {
    try { map.fitBounds(L.latLngBounds(g).pad(0.35), { maxZoom: 18, minZoom: 15 }); } catch(e){}
  } else if (g.length === 1) {
    map.setView(g[0], 18);
  } else {
    map.setView([35.1612, 127.0022], 17);
  }
}
updateView();
const ro = new ResizeObserver(() => { updateView(); });
ro.observe(document.getElementById('map'));
window.addEventListener('resize', updateView);
setTimeout(updateView, 400);
setTimeout(updateView, 1200);

</script></body></html>
