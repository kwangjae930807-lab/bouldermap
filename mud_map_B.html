<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
html,body{height:100%;margin:0;padding:0;background:#191919;overflow:hidden}
#map-wrap{width:100%;max-width:580px;height:100%;margin:0 auto;position:relative;border-radius:12px;overflow:hidden;box-shadow:0 4px 18px rgba(0,0,0,.6);border:1px solid rgba(255,255,255,0.08)}
#map{width:100%;height:100%}
.lbl{background:rgba(17,17,17,.85);color:#fff;border:0;border-radius:10px;padding:1px 6px;font:700 12px/1.3 system-ui,"Malgun Gothic",sans-serif;white-space:nowrap}
.lbl:before{display:none}
.title{position:absolute;z-index:999;left:10px;top:10px;background:rgba(0,0,0,.75);color:#fff;padding:6px 12px;border-radius:10px;font:700 14px/1.2 "Malgun Gothic",system-ui,sans-serif;backdrop-filter:blur(4px);pointer-events:none}
.note{position:absolute;z-index:999;right:10px;bottom:10px;background:rgba(255,255,255,.92);color:#222;padding:4px 8px;border-radius:8px;font:11px/1.2 system-ui;pointer-events:none}
</style>
</head>
<body>
<div id="map-wrap">
  <div class="title">무등산 B구역 볼더 위치</div>
  <div id="map"></div>
  <div class="note">위치: thetopo 좌표(대략) · 지도 API: Esri/OSM</div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const pts=[{"lat":35.160541,"lon":127.002612,"n":1,"name":"2월의 벚꽃","sec":"B구역","color":"#ffffff","inf":true},{"lat":35.16007,"lon":127.002281,"n":2,"name":"5년전에","sec":"B구역","color":"#ffffff","inf":true},{"lat":35.160146,"lon":127.002344,"n":3,"name":"고통의 숲","sec":"B구역","color":"#ffffff","inf":true},{"lat":35.16063,"lon":127.002481,"n":4,"name":"산타의 비밀상자","sec":"B구역","color":"#ffffff","inf":true},{"lat":35.160888,"lon":127.001883,"n":5,"name":"양일이","sec":"B구역","color":"#ffffff","inf":true},{"lat":35.1603,"lon":127.0024,"n":6,"name":"엄지공주","sec":"B구역","color":"#ffffff","inf":true},{"lat":35.160302,"lon":127.002605,"n":7,"name":"일석사조","sec":"B구역","color":"#ffffff","inf":true},{"lat":35.160517,"lon":127.002214,"n":8,"name":"B2 황금햇살","sec":"B구역","color":"#4da3ff","inf":false},{"lat":35.160479,"lon":127.002218,"n":9,"name":"B3 날포","sec":"B구역","color":"#4da3ff","inf":false},{"lat":35.160731,"lon":127.002247,"n":10,"name":"B5 애오라지","sec":"B구역","color":"#4da3ff","inf":false},{"lat":35.160658,"lon":127.001916,"n":11,"name":"B6 삼시세끼","sec":"B구역","color":"#4da3ff","inf":false},{"lat":35.1607,"lon":127.0021,"n":12,"name":"B7 여우비","sec":"B구역","color":"#4da3ff","inf":false},{"lat":35.16064,"lon":127.00187,"n":13,"name":"B8 애그리나","sec":"B구역","color":"#4da3ff","inf":false},{"lat":35.160678,"lon":127.001749,"n":14,"name":"B8 저너머엔","sec":"B구역","color":"#4da3ff","inf":false},{"lat":35.1607,"lon":127.0019,"n":15,"name":"B9 그린나래","sec":"B구역","color":"#4da3ff","inf":false},{"lat":35.161274,"lon":127.001512,"n":16,"name":"B10 폭삭","sec":"B구역","color":"#4da3ff","inf":false},{"lat":35.161296,"lon":127.001635,"n":17,"name":"B11 애지중지","sec":"B구역","color":"#4da3ff","inf":false},{"lat":35.161311,"lon":127.001797,"n":18,"name":"B12 시작이 절반","sec":"B구역","color":"#4da3ff","inf":false},{"lat":35.1614,"lon":127.0018,"n":19,"name":"B13 종이 호랑이","sec":"B구역","color":"#4da3ff","inf":false},{"lat":35.160505,"lon":127.002271,"n":20,"name":"B14 부라퀴","sec":"B구역","color":"#4da3ff","inf":false},{"lat":35.160874,"lon":127.00205,"n":21,"name":"B15 아름","sec":"B구역","color":"#4da3ff","inf":false},{"lat":35.160835,"lon":127.002205,"n":22,"name":"B16 2019MBF Man","sec":"B구역","color":"#4da3ff","inf":false},{"lat":35.16055,"lon":127.002273,"n":23,"name":"녹즙슬랩","sec":"B구역","color":"#ffffff","inf":true}];

let sumLat = 0, sumLon = 0;
pts.forEach(p => { sumLat += p.lat; sumLon += p.lon; });
const centerLat = pts.length ? (sumLat / pts.length) : 35.1610;
const centerLon = pts.length ? (sumLon / pts.length) : 127.0024;

const map = L.map('map', {
  center: [centerLat, centerLon],
  zoom: 18,
  zoomControl: true
});

L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Esri'}).addTo(map);
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_only_labels/{z}/{x}/{y}.png',{maxZoom:19,pane:'shadowPane',opacity:0.95}).addTo(map);

const g = [];
pts.forEach(p => {
  const c = L.circleMarker([p.lat, p.lon], {
    radius: 11,
    color: '#111',
    weight: 2,
    fillColor: p.color,
    fillOpacity: 0.95
  }).addTo(map);
  if (p.n !== '') c.bindTooltip(String(p.n), { permanent: true, direction: 'center', className: 'lbl' });
  c.bindPopup('<b>' + (p.n ? p.n + '. ' : '') + p.name + '</b>' + (p.inf ? '<br><span style="color:#666">구역 추정</span>' : '') + '<br><span style="color:#666">' + p.sec + '</span>');
  g.push([p.lat, p.lon]);
});

function fitSafely() {
  map.invalidateSize();
  if (g.length > 1) {
    const b = L.latLngBounds(g).pad(0.06);
    try { map.fitBounds(b, { maxZoom: 19, minZoom: 17 }); } catch(e){}
  } else if (g.length === 1) {
    map.setView(g[0], 18);
  }
}

const ro = new ResizeObserver(() => { fitSafely(); });
ro.observe(document.getElementById('map'));
window.addEventListener('resize', fitSafely);
window.addEventListener('load', fitSafely);
setTimeout(fitSafely, 300);
setTimeout(fitSafely, 1000);
</script>
</body>
</html>
