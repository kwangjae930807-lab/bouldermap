<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
html,body{height:100%;margin:0;padding:0;background:#191919;overflow:hidden}
#map-wrap{width:100%;max-width:580px;height:100%;margin:0 auto;position:relative;border-radius:12px;overflow:hidden;box-shadow:0 4px 18px rgba(0,0,0,.6);border:1px solid rgba(255,255,255,0.08)}
#map{width:100%;height:100%}
.lbl{background:rgba(17,17,17,.85);color:#fff;border:0;border-radius:10px;padding:1px 6px;font:700 12px/1.3 system-ui,"Malgun Gothic",sans-serif;white-space:nowrap}
.lbl:before{display:none}
.title{position:absolute;z-index:999;left:10px;top:10px;background:rgba(0,0,0,.75);color:#fff;padding:6px 12px;border-radius:10px;font:700 14px/1.2 "Malgun Gothic",system-ui,sans-serif;backdrop-filter:blur(4px);pointer-events:none}
.note{position:absolute;z-index:999;right:56px;bottom:12px;background:rgba(255,255,255,.92);color:#222;padding:4px 8px;border-radius:8px;font:11px/1.2 system-ui;pointer-events:none}
.full{position:absolute;z-index:1000;right:10px;top:10px;background:rgba(0,0,0,.75);color:#fff;text-decoration:none;padding:6px 10px;border-radius:10px;font:700 12px/1.2 system-ui,"Malgun Gothic",sans-serif;backdrop-filter:blur(4px)}
.hint{position:absolute;inset:0;z-index:1001;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.45);color:#fff;font:700 14px/1.4 system-ui,"Malgun Gothic",sans-serif;text-align:center;opacity:0;transition:opacity .25s;pointer-events:none}
.hint.on{opacity:1}

.gps-btn{position:absolute;z-index:1000;right:10px;bottom:12px;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.96);border:1px solid rgba(0,0,0,.15);box-shadow:0 3px 12px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;outline:none;-webkit-tap-highlight-color:transparent;transition:transform .15s,background .15s}
.gps-btn:active{transform:scale(.92)}
.gps-btn.active{background:#007aff}
.gps-btn.active svg path{fill:#fff}
.gps-btn.loading svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.gps-marker-wrap{position:relative;width:24px;height:24px}
.gps-dot{position:absolute;top:50%;left:50%;width:14px;height:14px;margin:-7px 0 0 -7px;background:#007aff;border:2.5px solid #fff;border-radius:50%;box-shadow:0 2px 6px rgba(0,0,0,.4);z-index:2}
.gps-pulse{position:absolute;top:50%;left:50%;width:36px;height:36px;margin:-18px 0 0 -18px;background:rgba(0,122,255,.35);border-radius:50%;animation:pulse 2s ease-out infinite;z-index:1}
@keyframes pulse{0%{transform:scale(.4);opacity:1}100%{transform:scale(1.5);opacity:0}}

.gps-toast{position:absolute;z-index:1002;left:50%;bottom:60px;transform:translateX(-50%) translateY(20px);background:rgba(20,20,20,.94);color:#fff;padding:8px 14px;border-radius:20px;font:600 12px/1.3 system-ui,"Malgun Gothic",sans-serif;box-shadow:0 6px 20px rgba(0,0,0,.45);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.15);white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s}
.gps-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.gps-toast-icon{margin-right:6px}
</style>
</head>
<body>
<div id="map-wrap">
  <div class="title">undefined</div>
  <a class="full" id="fullLink" href="#" target="_blank" rel="noopener">⤢ 크게 보기</a>
  <div class="note">위치: thetopo 좌표 · 지도: Esri</div>
  <div id="map"></div>
  <div class="hint" id="hint">지도를 움직이려면<br/>두 손가락을 사용하세요</div>

  <button class="gps-btn" id="gpsBtn" title="내 위치 찾기" aria-label="내 위치 찾기">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
      <path d="M12 8c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4zm8.94 3A8.994 8.994 0 0 0 13 3.06V1h-2v2.06A8.994 8.994 0 0 0 3.06 11H1v2h2.06A8.994 8.994 0 0 0 11 20.94V23h2v-2.06A8.994 8.994 0 0 0 20.94 13H23v-2h-2.06zM12 19c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z" fill="#222"/>
    </svg>
  </button>

  <div class="gps-toast" id="gpsToast">
    <span class="gps-toast-icon" id="toastIcon">📍</span><span id="toastMsg">내 위치를 찾는 중...</span>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const SECTOR_NAME = "잠수함 볼더";
const pts = [{"n":1,"name":"잠수함 볼더 (6개 루트)","sec":"잠수함","lat":37.42115,"lon":126.9244,"color":"#38bdf8","routesCount":6,"isMain":false}];
const centerLat = 37.42115;
const centerLon = 126.9244;
const defaultZoom = 19;
const minFitZoom = 18;
const isOverview = false;
const trailPoints = [];

const map = L.map('map', {
  center: [centerLat, centerLon],
  zoom: defaultZoom,
  zoomControl: true,
  dragging: !L.Browser.mobile,
  tap: !L.Browser.mobile
});

L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
  attribution: 'Tiles &copy; Esri',
  maxZoom: 19
}).addTo(map);

if (isOverview) {
  L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager_only_labels/{z}/{x}/{y}{r}.png', {
    subdomains: 'abcd',
    maxZoom: 19
  }).addTo(map);
}

if (trailPoints && trailPoints.length > 0) {
  L.polyline(trailPoints, {
    color: '#38bdf8',
    weight: 3.5,
    dashArray: '6, 6',
    opacity: 0.85
  }).addTo(map);
}

const bounds = [];
pts.forEach(p => {
  bounds.push([p.lat, p.lon]);
  const marker = L.circleMarker([p.lat, p.lon], {
    radius: isOverview ? (p.isMain ? 9 : 8) : 9,
    color: '#000',
    weight: 2,
    fillColor: p.color || '#f59e0b',
    fillOpacity: 0.95
  }).addTo(map);

  let labelHtml = p.name;
  if (isOverview) {
    labelHtml = `<span style="color:${p.color || '#f59e0b'};font-weight:bold;">${p.sec}</span> ${p.routesCount}개`;
  }
  marker.bindTooltip(labelHtml, {
    permanent: true,
    direction: 'top',
    offset: [0, -10],
    className: 'lbl'
  });
});

if (isOverview && bounds.length > 1) {
  map.fitBounds(bounds, { padding: [40, 40], maxZoom: minFitZoom });
}

const inFrame = window.self !== window.top;
const fullLink = document.getElementById('fullLink');
if (inFrame) {
  fullLink.href = window.location.href;
} else {
  fullLink.style.display = 'none';
}

const wrap = document.getElementById('map-wrap');
const hint = document.getElementById('hint');
let timer = null;
wrap.addEventListener('touchstart', e => {
  if (e.touches.length === 1) {
    hint.classList.add('on');
    clearTimeout(timer);
    timer = setTimeout(() => hint.classList.remove('on'), 1500);
  } else {
    hint.classList.remove('on');
  }
}, { passive: true });
wrap.addEventListener('touchend', () => hint.classList.remove('on'));

const gpsBtn = document.getElementById('gpsBtn');
const toast = document.getElementById('gpsToast');
const toastIcon = document.getElementById('toastIcon');
const toastMsg = document.getElementById('toastMsg');
let userMarker = null;
let userAccuracyCircle = null;
let toastTimer = null;

function showToast(text, icon = '📍', duration = 2800) {
  clearTimeout(toastTimer);
  toastMsg.textContent = text;
  toastIcon.textContent = icon;
  toast.classList.add('show');
  toastTimer = setTimeout(() => {
    toast.classList.remove('show');
  }, duration);
}

function getDistanceMeters(lat1, lon1, lat2, lon2) {
  const R = 6371e3;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
            Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
            Math.sin(dLon/2) * Math.sin(dLon/2);
  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  return R * c;
}

function handlePosition(lat, lon, accuracy) {
  gpsBtn.classList.remove('loading');
  gpsBtn.classList.add('active');

  const userLatLng = [lat, lon];
  const pulseIcon = L.divIcon({
    className: 'gps-custom-icon',
    html: '<div class="gps-marker-wrap"><div class="gps-pulse"></div><div class="gps-dot"></div></div>',
    iconSize: [24, 24],
    iconAnchor: [12, 12]
  });

  if (!userMarker) {
    userMarker = L.marker(userLatLng, { icon: pulseIcon, zIndexOffset: 2000 }).addTo(map);
    userAccuracyCircle = L.circle(userLatLng, {
      radius: Math.max(accuracy, 10),
      color: '#007aff',
      weight: 1,
      fillColor: '#007aff',
      fillOpacity: 0.12
    }).addTo(map);
  } else {
    userMarker.setLatLng(userLatLng);
    userAccuracyCircle.setLatLng(userLatLng);
    userAccuracyCircle.setRadius(Math.max(accuracy, 10));
  }

  let minDist = Infinity;
  let nearestPt = null;
  pts.forEach(p => {
    const d = getDistanceMeters(lat, lon, p.lat, p.lon);
    if (d < minDist) {
      minDist = d;
      nearestPt = p;
    }
  });

  const distToCenter = getDistanceMeters(lat, lon, centerLat, centerLon);

  if (minDist <= 50) {
    showToast('현재 ' + nearestPt.sec + '에 계시네요! (' + Math.round(minDist) + 'm)', '🎯');
  } else if (distToCenter <= 300) {
    showToast('가장 가까운 섹터: ' + nearestPt.sec + ' (' + Math.round(minDist) + 'm)', '📍');
  } else {
    const kmStr = (distToCenter / 1000).toFixed(1);
    showToast('현재 위치가 ' + SECTOR_NAME + '에서 ' + kmStr + 'km 떨어져 있어요', '🧭', 4000);
  }

  map.setView(userLatLng, Math.max(map.getZoom(), 17));
}

function locateUser() {
  if (!navigator.geolocation) {
    showToast('위치 서비스를 지원하지 않는 브라우저예요', '⚠️');
    return;
  }
  gpsBtn.classList.add('loading');
  navigator.geolocation.getCurrentPosition(
    pos => {
      const { latitude, longitude, accuracy } = pos.coords;
      handlePosition(latitude, longitude, accuracy);
    },
    err => {
      gpsBtn.classList.remove('loading');
      if (err.code === 1) {
        if (inFrame) {
          showToast('위치 권한이 차단되었어요 (상단 ⤢ 크게 보기 이용)', '🔒', 4000);
        } else {
          showToast('브라우저 위치 권한을 허용해주세요', '🔒', 3500);
        }
      } else if (err.code === 2) {
        showToast('현재 위치 신호를 잡을 수 없어요', '⚠️');
      } else if (err.code === 3) {
        showToast('위치 확인 시간이 초과되었어요', '⏱️');
      } else {
        showToast('위치를 확인할 수 없어요', '⚠️');
      }
    },
    { enableHighAccuracy: true, timeout: 8000, maximumAge: 30000 }
  );
}

gpsBtn.addEventListener('click', locateUser);
</script>
</body>
</html>
