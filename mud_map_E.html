<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
html,body{height:100%;margin:0;padding:0;background:#191919;overflow:hidden}
#map-wrap{width:100%;max-width:580px;height:100%;margin:0 auto;position:relative;border-radius:12px;overflow:hidden;box-shadow:0 4px 18px rgba(0,0,0,.6);border:1px solid rgba(255,255,255,0.08)}
#map{width:100%;height:100%}
.lbl{background:rgba(17,17,17,.85);color:#fff;border:0;border-radius:10px;padding:1px 6px;font:700 12px/1.3 system-ui,"Malgun Gothic",sans-serif;white-space:nowrap}
.lbl:before{display:none}
.title{position:absolute;z-index:999;left:10px;top:10px;background:rgba(0,0,0,.75);color:#fff;padding:6px 12px;border-radius:10px;font:700 14px/1.2 "Malgun Gothic",system-ui,sans-serif;backdrop-filter:blur(4px);pointer-events:none}
.note{position:absolute;z-index:999;right:10px;bottom:10px;background:rgba(255,255,255,.92);color:#222;padding:4px 8px;border-radius:8px;font:11px/1.2 system-ui;pointer-events:none}
</style>
</head>
<body>
<div id="map-wrap">
  <div class="title">무등산 E구역 볼더 위치</div>
  <div id="map"></div>
  <div class="note">위치: thetopo 좌표(대략) · 지도 API: Esri/OSM</div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const pts=[{"lat":35.160352,"lon":127.001214,"n":1,"name":"흑기사","sec":"E구역","color":"#ffffff","inf":true},{"lat":35.1606,"lon":127.0016,"n":2,"name":"E1 한울아","sec":"E구역","color":"#5fd068","inf":false},{"lat":35.160345,"lon":127.00144,"n":3,"name":"E2","sec":"E구역","color":"#5fd068","inf":false},{"lat":35.160376,"lon":127.001363,"n":4,"name":"E3","sec":"E구역","color":"#5fd068","inf":false},{"lat":35.160413,"lon":127.001269,"n":5,"name":"E4 4/4","sec":"E구역","color":"#5fd068","inf":false},{"lat":35.1604,"lon":127.0012,"n":6,"name":"E5 큰산","sec":"E구역","color":"#5fd068","inf":false},{"lat":35.160553,"lon":127.001193,"n":7,"name":"E6 작은산","sec":"E구역","color":"#5fd068","inf":false},{"lat":35.160693,"lon":127.001104,"n":8,"name":"E7 탑이눈앞에","sec":"E구역","color":"#5fd068","inf":false}];

let sumLat = 0, sumLon = 0;
pts.forEach(p => { sumLat += p.lat; sumLon += p.lon; });
const centerLat = pts.length ? (sumLat / pts.length) : 35.1610;
const centerLon = pts.length ? (sumLon / pts.length) : 127.0024;

const map = L.map('map', {
  center: [centerLat, centerLon],
  zoom: 18,
  zoomControl: true
});

L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Esri'}).addTo(map);
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_only_labels/{z}/{x}/{y}.png',{maxZoom:19,pane:'shadowPane',opacity:0.95}).addTo(map);

const g = [];
pts.forEach(p => {
  const c = L.circleMarker([p.lat, p.lon], {
    radius: 11,
    color: '#111',
    weight: 2,
    fillColor: p.color,
    fillOpacity: 0.95
  }).addTo(map);
  if (p.n !== '') c.bindTooltip(String(p.n), { permanent: true, direction: 'center', className: 'lbl' });
  c.bindPopup('<b>' + (p.n ? p.n + '. ' : '') + p.name + '</b>' + (p.inf ? '<br><span style="color:#666">구역 추정</span>' : '') + '<br><span style="color:#666">' + p.sec + '</span>');
  g.push([p.lat, p.lon]);
});

function fitSafely() {
  map.invalidateSize();
  if (g.length > 1) {
    const b = L.latLngBounds(g).pad(0.06);
    try { map.fitBounds(b, { maxZoom: 19, minZoom: 17 }); } catch(e){}
  } else if (g.length === 1) {
    map.setView(g[0], 18);
  }
}

const ro = new ResizeObserver(() => { fitSafely(); });
ro.observe(document.getElementById('map'));
window.addEventListener('resize', fitSafely);
window.addEventListener('load', fitSafely);
setTimeout(fitSafely, 300);
setTimeout(fitSafely, 1000);
</script>
</body>
</html>
