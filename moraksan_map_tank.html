<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
html,body{height:100%;margin:0;padding:0;background:#191919;overflow:hidden}
#map-wrap{width:100%;max-width:580px;height:100%;margin:0 auto;position:relative;border-radius:12px;overflow:hidden;box-shadow:0 4px 18px rgba(0,0,0,.6);border:1px solid rgba(255,255,255,0.08)}
#map{width:100%;height:100%}
.lbl{background:rgba(17,17,17,.85);color:#fff;border:0;border-radius:10px;padding:1px 6px;font:700 12px/1.3 system-ui,"Malgun Gothic",sans-serif;white-space:nowrap}
.lbl:before{display:none}
.title{position:absolute;z-index:999;left:10px;top:10px;background:rgba(0,0,0,.75);color:#fff;padding:6px 12px;border-radius:10px;font:700 14px/1.2 "Malgun Gothic",system-ui,sans-serif;backdrop-filter:blur(4px);pointer-events:none}
.note{position:absolute;z-index:999;right:56px;bottom:12px;background:rgba(255,255,255,.92);color:#222;padding:4px 8px;border-radius:8px;font:11px/1.2 system-ui;pointer-events:none}
.full{position:absolute;z-index:1000;right:10px;top:10px;background:rgba(0,0,0,.75);color:#fff;text-decoration:none;padding:6px 10px;border-radius:10px;font:700 12px/1.2 system-ui,"Malgun Gothic",sans-serif;backdrop-filter:blur(4px)}
.hint{position:absolute;inset:0;z-index:1001;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.45);color:#fff;font:700 14px/1.4 system-ui,"Malgun Gothic",sans-serif;text-align:center;opacity:0;transition:opacity .25s;pointer-events:none}
.hint.on{opacity:1}
.lbl.cl{background:#ffd23f;color:#111}

/* GPS 버튼 */
.gps-btn{position:absolute;z-index:1000;right:10px;bottom:10px;width:38px;height:38px;border-radius:50%;background:rgba(0,0,0,.8);backdrop-filter:blur(4px);border:1px solid rgba(255,255,255,.25);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 3px 12px rgba(0,0,0,.5);transition:all .2s;outline:none;-webkit-tap-highlight-color:transparent}
.gps-btn:active{transform:scale(0.92);background:rgba(40,40,40,.9)}
.gps-btn.active{background:#007aff;border-color:#007aff;color:#fff}
.gps-btn.loading svg{animation:spin 1s linear infinite}
@keyframes spin{100%{transform:rotate(360deg)}}

/* 현재 위치 파란 점 */
.gps-marker-wrap{display:flex;align-items:center;justify-content:center;width:24px;height:24px}
.gps-dot{position:relative;width:12px;height:12px;background:#007aff;border:2px solid #fff;border-radius:50%;box-shadow:0 0 5px rgba(0,0,0,.6)}
.gps-pulse{position:absolute;width:28px;height:28px;border-radius:50%;background:rgba(0,122,255,.3);animation:gpsPulse 2s infinite ease-out;pointer-events:none}
@keyframes gpsPulse{0%{transform:scale(.5);opacity:1}100%{transform:scale(1.8);opacity:0}}

/* 하단 알림 토스트 */
.toast{position:absolute;bottom:16px;left:50%;transform:translateX(-50%) translateY(20px);z-index:1002;background:rgba(24,24,27,.95);color:#fff;padding:8px 16px;border-radius:20px;font:600 13px/1.4 system-ui,-apple-system,"Malgun Gothic",sans-serif;border:1px solid rgba(255,255,255,.18);box-shadow:0 6px 20px rgba(0,0,0,.6);backdrop-filter:blur(8px);pointer-events:none;opacity:0;transition:all .28s cubic-bezier(.16,1,.3,1);white-space:nowrap;display:flex;align-items:center;gap:6px}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast .icon{font-size:14px;line-height:1}

@media (max-width:480px){
  #map-wrap{border-radius:8px}
  .lbl{font-size:10px;padding:0 4px}
  .title{font-size:12px;padding:4px 8px;left:6px;top:6px}
  .full{font-size:11px;padding:4px 8px;right:6px;top:6px}
  .gps-btn{width:36px;height:36px;right:8px;bottom:8px}
  .toast{font-size:12px;padding:7px 14px;bottom:12px}
  .note{display:none}
}
</style>
</head>
<body>
<div id="map-wrap">
  <div class="title">모락산 탱크 볼더 지도</div>
  <a class="full" id="full" href="#" target="_blank" rel="noopener">⤢ 크게 보기</a>
  <div id="map"></div>
  <div class="hint" id="hint">두 손가락으로 지도를 움직이세요</div>
  <div class="note">위치: thetopo 좌표 · 지도: Esri</div>

  <button class="gps-btn" id="gps-btn" type="button" aria-label="현재 위치 찾기" title="현재 위치">
    <svg id="gps-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="7"/>
      <line x1="12" y1="2" x2="12" y2="5"/>
      <line x1="12" y1="19" x2="12" y2="22"/>
      <line x1="2" y1="12" x2="5" y2="12"/>
      <line x1="19" y1="12" x2="22" y2="12"/>
      <circle cx="12" cy="12" r="2" fill="currentColor"/>
    </svg>
  </button>

  <div class="toast" id="toast">
    <span class="icon" id="toast-icon">📍</span>
    <span id="toast-msg">현재 위치가 탱크 볼더이 아니에요</span>
  </div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const SECTOR_NAME = "탱크 볼더";
const pts = [{"n":1,"name":"Dab boulder","sec":"Dab","lat":37.376506,"lon":126.978492,"color":"#64748b","routesCount":17},{"n":2,"name":"마당 볼더","sec":"마당","lat":37.375899,"lon":126.978113,"color":"#64748b","routesCount":6},{"n":3,"name":"크롱 볼더","sec":"크롱","lat":37.37564,"lon":126.978704,"color":"#64748b","routesCount":6},{"n":4,"name":"리틀 볼더","sec":"리틀","lat":37.375371,"lon":126.978269,"color":"#64748b","routesCount":7},{"n":5,"name":"탱크 볼더","sec":"탱크","lat":37.375882,"lon":126.978467,"color":"#60a5fa","routesCount":3},{"n":6,"name":"모비딕 볼더","sec":"모비딕","lat":37.375648,"lon":126.978302,"color":"#64748b","routesCount":6},{"n":7,"name":"부엉이 바위","sec":"부엉이","lat":37.3753,"lon":126.9782,"color":"#64748b","routesCount":2},{"n":8,"name":"사선크랙 볼더","sec":"사선크랙","lat":37.37523,"lon":126.97821,"color":"#64748b","routesCount":1},{"n":9,"name":"모락산","sec":"모락산","lat":37.375868,"lon":126.978409,"color":"#64748b","routesCount":0},{"n":10,"name":"Valley Boulder","sec":"Valley","lat":37.376282,"lon":126.978159,"color":"#64748b","routesCount":0}];
const centerLat = 37.375882;
const centerLon = 126.978467;

const inFrame = window.self !== window.top;
const isTouch = window.matchMedia('(pointer:coarse)').matches || L.Browser.mobile;
const isNarrow = window.matchMedia('(max-width:480px)').matches;

const map = L.map('map', {
  center: [centerLat, centerLon],
  zoom: 19,
  zoomControl: !isNarrow,
  dragging: !(inFrame && isTouch),
  scrollWheelZoom: !inFrame
});
const R = isNarrow ? (10) : 12;

L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
  maxZoom: 19,
  attribution: 'Tiles &copy; Esri'
}).addTo(map);

L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager_only_labels/{z}/{x}/{y}{r}.png', {
  subdomains: 'abcd',
  maxZoom: 19
}).addTo(map);

document.getElementById('full').href = window.location.href;

let hintTimer;
function showHint() {
  const h = document.getElementById('hint');
  h.classList.add('on');
  clearTimeout(hintTimer);
  hintTimer = setTimeout(() => h.classList.remove('on'), 1500);
}

if (inFrame && isTouch) {
  const el = document.getElementById('map');
  el.addEventListener('touchstart', e => {
    if (e.touches.length === 1) showHint();
    else if (e.touches.length > 1) map.dragging.enable();
  }, { passive: true });
  el.addEventListener('touchend', e => {
    if (e.touches.length < 2) map.dragging.disable();
  }, { passive: true });
}

const markers = [];
const latLngs = [];

pts.forEach(p => {
  const m = L.circleMarker([p.lat, p.lon], {
    radius: R,
    color: '#fff',
    weight: 2,
    fillColor: p.color,
    fillOpacity: 1
  }).addTo(map);

  const countStr = p.routesCount ? ' (' + p.routesCount + ')' : '';
  const isTarget = p.name === SECTOR_NAME;
  const labelClass = isTarget ? 'lbl cl' : 'lbl';
  const labelText = p.n + '. ' + p.sec + countStr;

  m.bindTooltip(labelText, {
    permanent: true,
    direction: 'bottom',
    className: labelClass,
    offset: [0, 8]
  });

  markers.push(m);
  latLngs.push([p.lat, p.lon]);
});

if (latLngs.length > 1) {
  map.fitBounds(latLngs, { padding: [25, 25], maxZoom: 19 });
}

// GPS 기능
const gpsBtn = document.getElementById('gps-btn');
const toast = document.getElementById('toast');
const toastMsg = document.getElementById('toast-msg');
const toastIcon = document.getElementById('toast-icon');
let toastTimer;
let userMarker = null;
let userAccuracyCircle = null;

function showToast(msg, icon = '📍', duration = 3000) {
  toastMsg.textContent = msg;
  toastIcon.textContent = icon;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), duration);
}

function getDistanceMeters(lat1, lon1, lat2, lon2) {
  const R_EARTH = 6371000;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
            Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
            Math.sin(dLon/2) * Math.sin(dLon/2);
  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  return R_EARTH * c;
}

function handlePosition(lat, lon, accuracy) {
  gpsBtn.classList.remove('loading');
  gpsBtn.classList.add('active');

  const userLatLng = [lat, lon];
  const pulseIcon = L.divIcon({
    className: 'gps-custom-icon',
    html: '<div class="gps-marker-wrap"><div class="gps-pulse"></div><div class="gps-dot"></div></div>',
    iconSize: [24, 24],
    iconAnchor: [12, 12]
  });

  if (!userMarker) {
    userMarker = L.marker(userLatLng, { icon: pulseIcon, zIndexOffset: 2000 }).addTo(map);
    userAccuracyCircle = L.circle(userLatLng, {
      radius: Math.max(accuracy, 10),
      color: '#007aff',
      weight: 1,
      fillColor: '#007aff',
      fillOpacity: 0.12
    }).addTo(map);
  } else {
    userMarker.setLatLng(userLatLng);
    userAccuracyCircle.setLatLng(userLatLng);
    userAccuracyCircle.setRadius(Math.max(accuracy, 10));
  }

  let minDist = Infinity;
  let nearestPt = null;
  pts.forEach(p => {
    const d = getDistanceMeters(lat, lon, p.lat, p.lon);
    if (d < minDist) {
      minDist = d;
      nearestPt = p;
    }
  });

  const distToCenter = getDistanceMeters(lat, lon, centerLat, centerLon);

  if (minDist <= 50) {
    showToast('현재 ' + nearestPt.sec + '에 계시네요! (' + Math.round(minDist) + 'm)', '🎯');
  } else if (distToCenter <= 300) {
    showToast('가장 가까운 볼더: ' + nearestPt.sec + ' (' + Math.round(minDist) + 'm)', '📍');
  } else {
    const kmStr = (distToCenter / 1000).toFixed(1);
    showToast('현재 위치가 ' + SECTOR_NAME + '에서 ' + kmStr + 'km 떨어져 있어요', '🧭', 4000);
  }

  map.setView(userLatLng, Math.max(map.getZoom(), 17));
}

function locateUser() {
  if (!navigator.geolocation) {
    showToast('위치 서비스를 지원하지 않는 브라우저예요', '⚠️');
    return;
  }
  gpsBtn.classList.add('loading');
  navigator.geolocation.getCurrentPosition(
    pos => {
      const { latitude, longitude, accuracy } = pos.coords;
      handlePosition(latitude, longitude, accuracy);
    },
    err => {
      gpsBtn.classList.remove('loading');
      if (err.code === 1) {
        if (inFrame) {
          showToast('위치 권한이 차단되었어요 (상단 ⤢ 크게 보기 이용)', '🔒', 4000);
        } else {
          showToast('브라우저 위치 권한을 허용해주세요', '🔒', 3500);
        }
      } else if (err.code === 2) {
        showToast('현재 위치 신호를 잡을 수 없어요', '⚠️');
      } else if (err.code === 3) {
        showToast('위치 확인 시간이 초과되었어요', '⏱️');
      } else {
        showToast('위치를 확인할 수 없어요', '⚠️');
      }
    },
    { enableHighAccuracy: true, timeout: 8000, maximumAge: 10000 }
  );
}

gpsBtn.addEventListener('click', locateUser);
window.simulateGps = function(lat, lon, acc = 15) { handlePosition(lat, lon, acc); };
</script>
</body>
</html>
