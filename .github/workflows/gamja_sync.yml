# 토포 자동 동기화 (테스트판, 다암장) -- 노션 DB -> test/<암장>_routes.json
# 암장 목록: test/tools/crags.json (감자볼더 gamja + 현충 바위 memorial). 암장마다 안전장치가 독립이라
# 한 암장이 실패/중단돼도 다른 암장은 계속 처리된다 (전체 결과는 하나라도 실패하면 실패 표시).
# secret NOTION_TOKEN (읽기 전용 내부 통합 토큰). 통합은 각 테스트 DB 페이지에 연결되어 있어야 함.
name: gamja-sync

on:
  schedule:
    # 12시간마다: UTC 03:17 / 15:17 = 한국시간 12:17 / 00:17 (정각 혼잡 회피로 17분)
    # 즉시 반영이 필요하면 Actions 화면의 "Run workflow"(수동 실행)
    - cron: '17 3,15 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: '안전장치 무시 (--force)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: gamja-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Sync from Notion (official API, all crags)
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          FORCE: ${{ inputs.force }}
        run: |
          ARGS=""
          if [ "$FORCE" = "true" ]; then ARGS="--force"; fi
          python3 test/tools/sync_notion_routes.py --source api \
            --config test/tools/crags.json \
            --log-file /tmp/topo_sync_log.jsonl $ARGS

      - name: Commit routes.json files only if changed
        if: always()
        run: |
          if git diff --quiet -- test/gamja_routes.json test/memorial_routes.json; then
            echo "no changes"
          else
            git config user.name  "gamja-sync[bot]"
            git config user.email "gamja-sync@users.noreply.github.com"
            git add test/gamja_routes.json test/memorial_routes.json
            git commit -m "test: sync topo routes from notion (actions)"
            git pull --rebase
            git push
          fi

      - name: Show change log
        if: always()
        run: cat /tmp/topo_sync_log.jsonl || true
