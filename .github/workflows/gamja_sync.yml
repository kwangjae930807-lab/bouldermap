# 감자볼더 토포 자동 동기화 (테스트판) -- 노션 DB -> test/gamja_routes.json
# secret NOTION_TOKEN (읽기 전용 내부 통합 토큰). 통합은 테스트 DB 페이지에 연결되어 있어야 함.
# 안전장치: 행 0개 또는 루트 30% 초과 감소 시 스크립트가 exit 2 로 중단 -> 커밋 없음
name: gamja-sync

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: '안전장치 무시 (--force)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: gamja-sync
  cancel-in-progress: false

env:
  NOTION_DATABASE_ID: 99ad5ebc-111e-439b-aa3d-d1318e1930f3

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Sync from Notion (official API)
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          FORCE: ${{ inputs.force }}
        run: |
          ARGS=""
          if [ "$FORCE" = "true" ]; then ARGS="--force"; fi
          python3 test/tools/sync_notion_routes.py --source api \
            --routes-file test/gamja_routes.json \
            --geometry-file test/gamja_topo_geometry.json \
            --log-file /tmp/gamja_sync_log.jsonl $ARGS

      - name: Commit routes.json only if changed
        run: |
          if git diff --quiet -- test/gamja_routes.json; then
            echo "no changes"
          else
            git config user.name  "gamja-sync[bot]"
            git config user.email "gamja-sync@users.noreply.github.com"
            git add test/gamja_routes.json
            git commit -m "test: sync gamja routes from notion (actions)"
            git pull --rebase
            git push
          fi

      - name: Show change log
        if: always()
        run: cat /tmp/gamja_sync_log.jsonl || true
